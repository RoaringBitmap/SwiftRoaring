name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  linux:
    name: Swift ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: swift:${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["5.6-focal", "5.10", "6.2", "latest"]
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
