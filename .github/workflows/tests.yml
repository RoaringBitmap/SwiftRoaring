name: Swift on Ubuntu (latest)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    # The official image, rather than fwal/setup-swift, which does not
    # support Ubuntu 26.04 (ubuntu-latest).
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: swift --version
      - name: linuxmain
        run: swift test
      - name: Build
        run: swift build
      - name: Test
        run: swift test